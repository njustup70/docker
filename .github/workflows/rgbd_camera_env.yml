name: RGB-D 相机环境构建

on:
  pull_request:
    branches: [master]
    paths:
      - 'ros2/image_handle/rgbd/**'
      - '.github/workflows/rgbd_camera_env.yml'
  push:
    branches: [master]
    paths:
      - 'ros2/image_handle/rgbd/**'
      - '.github/workflows/rgbd_camera_env.yml'

permissions:
  contents: read

jobs:
  rgbd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 释放预装工具占用的空间
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - name: 检查脚本
        run: |
          for script in ros2/image_handle/rgbd/*.bash; do
            bash -n "$script"
          done
      - name: 构建检查镜像（不推送）
        run: bash ros2/image_handle/rgbd/build.bash --github-action
      - name: 检查运行用户与依赖
        run: >-
          docker run --rm --network none up70docker/rc2027:driverLogic-rgbd
          python3 /opt/up70-rgbd/verify_env.py
      - name: 登录 Docker Hub（仅 master 发布）
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: 发布已验证镜像
        if: github.event_name == 'push'
        run: docker push up70docker/rc2027:driverLogic-rgbd
