name: RGB-D 相机环境构建

on:
  pull_request:
    branches: [master]
    paths:
      - 'ros2/image_handle/rgbd/**'
      - '.github/workflows/rgbd_camera_env.yml'
  push:
    branches: [master]
    paths:
      - 'ros2/image_handle/rgbd/**'
      - '.github/workflows/rgbd_camera_env.yml'

permissions:
  contents: read

jobs:
  rgbd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 释放预装工具占用的空间
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像（PR）
        if: github.event_name == 'pull_request'
        run: bash ros2/image_handle/rgbd/build.bash
      - name: 登录 Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: 构建并推送镜像
        if: github.event_name == 'push'
        run: bash ros2/image_handle/rgbd/build.bash --github-action
