name: Docker镜像构建与推送  

on:
  # push:
  push:
    branches: ["master"]
    paths:
      - '**/Dockerfile*'      # 捕获所有以 Dockerfile 开头的文件，包括 Dockerfile 和 .Dockerfile
      - '**/.dockerfile*'     # 捕获以 .dockerfile 开头的文件
      - '**/build.bash'       # 捕获所有目录下的 build.bash 文件
  pull_request:
    branches: ["*"]  #pr到[]分支时触发
    paths:
      - '**/Dockerfile*'      # 捕获所有以 Dockerfile 开头的文件，包括 Dockerfile 和 .Dockerfile
      - '**/.dockerfile*'     # 捕获以 .dockerfile 开头的文件
      - '**/build.bash'       # 捕获所有目录下的 build.bash 文件
env:
  # 可设置为 docker.io 或 ghcr.io
  REGISTRY: docker.io
  #仓库名
  REPO_NAME: elainasuki/ros
  # 是否构建arm64架构的镜像
  BUILD_ARM64: false  # 你可以在这里设置是否构建 arm64

jobs:
  build-and-push:
    name: 构建并推送镜像  # 中文 job 名称（显示用）
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 获取最近两次提交的历史记录
      - name: 设置模拟器
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - name: 设置 Buildx 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录docker 
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'ghcr.io' && github.actor || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ env.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.DOCKER_HUB_PASSWORD }}

      - name: 设置构建的环境变量
        id: prep
        run: |
          if [[ "${{ env.REGISTRY }}" == "docker.io" ]]; then
            echo "IMAGE_REPO=${{ env.REPO_NAME }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REPO=${{ env.REGISTRY }}/${{ env.REPO_NAME }}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_ARM64=${{ env.BUILD_ARM64 }}" >> "$GITHUB_ENV"  # 设置 BUILD_ARM64 环境变量
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 关键：设置为 0 或至少 2，以确保能对比当前 commit 和前一个 commit
          fetch-depth: 2 

      # ... 中间省略 setup 步骤 ...

      - name: 检测更改并执行对应 build.bash
        run: |
          echo "🔍 检测最新一次提交改动的文件..."

          # 判断是否为 PR 或 Push，统一只对比最后一次提交
          # 如果是新分支的第一次提交，HEAD^ 可能会失败，所以加个判断
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            RANGE="HEAD^ HEAD"
          else
            # 如果没有上一个节点（比如初始提交），则对比当前所有文件
            RANGE="HEAD"
          fi

          echo "🔁 检查范围: $RANGE"

          # 获取变更文件（注意：如果是单一 commit，去掉 xargs 直接获取即可）
          CHANGED_FILES=$(git diff --name-only $RANGE | \
            grep -Ei '(^|/)Dockerfile|(^|/)\.dockerfile|(^|/)build\.bash' || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "✅ 本次提交没有相关变更，跳过构建。"
            exit 0
          fi

          echo "📄 本次提交检测到变更的文件:"
          echo "$CHANGED_FILES"

          # 获取每个变动文件所在目录，去重
          # 用 sort -u 确保同一个目录下多个文件变动只触发一次构建
          CHANGED_DIRS=$(echo "$CHANGED_FILES" | xargs -I {} dirname {} | sort -u)

          for dir in $CHANGED_DIRS; do
            script_path="$dir/build.bash"
            if [[ -f "$script_path" ]]; then
              echo "🚀 针对变更目录执行 $script_path ..."
              bash "$script_path" --github-action
            else
              echo "⚠️ $dir 中找不到 build.bash ，跳过。"
            fi
          done