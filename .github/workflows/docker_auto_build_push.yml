name: Docker镜像构建与推送  

on:
  # push:
  push:
    branches: ["master"]
    paths:
      - '**/Dockerfile*'      # 捕获所有以 Dockerfile 开头的文件，包括 Dockerfile 和 .Dockerfile
      - '**/.dockerfile*'     # 捕获以 .dockerfile 开头的文件
      - '**/build.bash'       # 捕获所有目录下的 build.bash 文件
  pull_request:
    branches: ["*"]  #pr到[]分支时触发
    paths:
      - '**/Dockerfile*'      # 捕获所有以 Dockerfile 开头的文件，包括 Dockerfile 和 .Dockerfile
      - '**/.dockerfile*'     # 捕获以 .dockerfile 开头的文件
      - '**/build.bash'       # 捕获所有目录下的 build.bash 文件
env:
  # 可设置为 docker.io 或 ghcr.io
  REGISTRY: docker.io
  #仓库名
  REPO_NAME: elainasuki/ros
  # 是否构建arm64架构的镜像
  BUILD_ARM64: false  # 你可以在这里设置是否构建 arm64

jobs:
  build-and-push:
    name: 构建并推送镜像  # 中文 job 名称（显示用）
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 获取最近两次提交的历史记录
      - name: 设置模拟器
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - name: 设置 Buildx 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录docker 
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'ghcr.io' && github.actor || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ env.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.DOCKER_HUB_PASSWORD }}

      - name: 设置构建的环境变量
        id: prep
        run: |
          if [[ "${{ env.REGISTRY }}" == "docker.io" ]]; then
            echo "IMAGE_REPO=${{ env.REPO_NAME }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REPO=${{ env.REGISTRY }}/${{ env.REPO_NAME }}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_ARM64=${{ env.BUILD_ARM64 }}" >> "$GITHUB_ENV"  # 设置 BUILD_ARM64 环境变量
      - name: 检测最后一次提交的改动
        run: |
          echo "🔍 正在检测最后一次推送（Latest Push）产生的改动..."

          # 获取对比范围
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # 在 PR 中，event.before 是该 PR 上一次触发时的 HEAD
            # 如果是 PR 的第一次提交，before 可能是全 0
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.event.after }}"
            
            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              echo "ℹ️ 检测到这是 PR 的首次推送，对比范围设为 HEAD~1..HEAD"
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE_SHA..$AFTER_SHA"
            fi
          else
            # 普通 Push 场景
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "🔁 增量检查范围: $RANGE"

          # 获取变动文件 (过滤掉已删除文件)
          # git diff 如果因为 fetch 深度报错，这里会返回空
          CHANGED_FILES=$(git diff --name-only --diff-filter=d $RANGE | \
            grep -Ei '(^|/)Dockerfile|(^|/)\.dockerfile|(^|/)build\.bash' || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "✅ 本次提交未涉及相关文件改动，跳过构建。"
            exit 0
          fi

          echo "📄 本次 Push 新增改动文件:"
          echo "$CHANGED_FILES"

          # 提取目录并去重
          CHANGED_DIRS=$(echo "$CHANGED_FILES" | xargs -n1 dirname | sort -u)

          for dir in $CHANGED_DIRS; do
            script_path="$dir/build.bash"
            if [[ -f "$script_path" ]]; then
              echo "🚀 仅针对本次增量执行: $script_path ..."
              bash "$script_path" --github-action
            else
              echo "⚠️ $dir 目录中未找到 build.bash"
            fi
          done